name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build BSE_Code.csproj --no-restore -c Release

      - name: Test
        run: dotnet test tests/BSE_Code.Tests.csproj --no-restore -c Release

  build:
    name: Build ${{ matrix.rid }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset: bse-code-win-x64.exe
          - os: ubuntu-latest
            rid: linux-x64
            asset: bse-code-linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
            asset: bse-code-linux-arm64
          - os: macos-latest
            rid: osx-x64
            asset: bse-code-osx-x64
          - os: macos-latest
            rid: osx-arm64
            asset: bse-code-osx-arm64

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained binary
        run: >
          dotnet publish BSE_Code.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish/${{ matrix.rid }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: Rename-Item ./publish/${{ matrix.rid }}/bse-code.exe ${{ matrix.asset }}
        shell: pwsh

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: mv ./publish/${{ matrix.rid }}/bse-code ./publish/${{ matrix.rid }}/${{ matrix.asset }}

      # Smoke test — verify the binary actually runs before we ship it
      - name: Smoke test binary (Windows)
        if: matrix.os == 'windows-latest'
        run: ./publish/${{ matrix.rid }}/${{ matrix.asset }} --version
        shell: pwsh

      - name: Smoke test binary (Unix)
        if: matrix.os != 'windows-latest'
        run: ./publish/${{ matrix.rid }}/${{ matrix.asset }} --version

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ./publish/${{ matrix.rid }}/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # needed for git-cliff changelog

      - uses: actions/download-artifact@v7
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header
        continue-on-error: true  # don't fail if cliff.toml is missing

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          body: ${{ steps.changelog.outputs.content }}

  npm-publish:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Set version from tag
        run: npm version ${GITHUB_REF_NAME#v} --no-git-tag-version --allow-same-version
        working-directory: ./npm

      - name: Publish to npm
        run: npm publish
        working-directory: ./npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  nuget-publish:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Pack
        run: |
          VERSION="${{ github.ref_name }}"
          dotnet pack BSE_Code.csproj -c Release -o ./nupkg -p:Version="${VERSION#v}"

      - name: Publish to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
